runtime: python312

# Staging config. Deploy with:
#   gcloud app deploy staging.yaml --project=cardboard-party-staging
# Differences from production (app.yaml):
#   - NO CANONICAL_HOST  → staging serves on its own appspot URL and never
#     redirects to cardboardparty.gg.
#   - AVATARS_BUCKET     → staging's own GCS bucket (isolated images).
#   - GOOGLE_CLIENT_ID   → staging's own OAuth client (fill in below).
# The staging project needs its own Secret Manager entries (GOOGLE_CLIENT_SECRET,
# FLASK_SECRET_KEY) — see DEPLOYING.md.

# Keep one instance warm so Discord interactions answer within its 3s limit.
automatic_scaling:
  min_instances: 1

# Warm new instances before routing live traffic (see app.yaml) so a fresh
# deploy's first Discord interaction doesn't hit the cold-start timeout.
inbound_services:
  - warmup

handlers:
  # Assets are requested with ?v=<deploy version>, so the URL changes every deploy
  # — safe to cache aggressively for repeat visits.
  - url: /static
    static_dir: static
    expiration: "30d"

  - url: /.*
    script: auto

env_variables:
  FLASK_ENV: production            # keep secure cookies (staging is HTTPS via appspot)
  AVATARS_BUCKET: "cardboard-party-staging-avatars"
  # Replace with the staging project's OAuth 2.0 client ID once created, and add
  # https://cardboard-party-staging.<region>.r.appspot.com/auth/callback to its
  # Authorized redirect URIs.
  GOOGLE_CLIENT_ID: "763844211840-hp56qvqtfthnfj21d9ol4o9u73efqj2b.apps.googleusercontent.com"
  # No CANONICAL_HOST on purpose — staging must not redirect to the prod domain.
  # Staging's bot command is /cpstaging so it doesn't collide with prod's /cparty
  # in a shared Discord server (both run the same code).
  DISCORD_COMMAND_NAME: cpstaging
  # MAPS_API_KEY is NOT stored here — it lives in Secret Manager (secret name:
  # MAPS_API_KEY) and is fetched at startup by gcp_secrets.py.
