runtime: python312

# Keep one instance warm so Discord interactions answer within its 3s limit
# (cold starts can exceed it). ~24 instance-hours/day stays near the free tier.
automatic_scaling:
  min_instances: 1

handlers:
  - url: /static
    static_dir: static

  - url: /.*
    script: auto

env_variables:
  FLASK_ENV: production
  # Public value (sent to browsers during OAuth). OAuth client lives in the
  # cardboard-party project (matches the GOOGLE_CLIENT_SECRET in its Secret Manager).
  GOOGLE_CLIENT_ID: "52928879537-r88u039f214kfa2kaalmm4a0hfr5a8dj.apps.googleusercontent.com"
  # GOOGLE_CLIENT_SECRET is NOT stored here — it lives in Secret Manager
  # (secret name: GOOGLE_CLIENT_SECRET) and is fetched at startup by gcp_secrets.py.
  #
  # Custom domain: once cardboardparty.gg is verified, mapped, and serving via
  # App Engine (DNS at Google + managed SSL active), uncomment the next line and
  # redeploy. All URLs (and Discord links) will then use the custom domain, and
  # appspot/www hits 301-redirect to it. Also add the new host to the OAuth
  # client's Authorized redirect URIs (https://cardboardparty.gg/auth/callback).
  CANONICAL_HOST: cardboardparty.gg