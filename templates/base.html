<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cardboard Party{% endblock %}</title>
  <meta name="theme-color" content="#a78bfa">
  <link rel="icon" href="/static/favicon.ico?v={{ asset_v }}" sizes="any">
  <link rel="icon" href="/static/favicon.svg?v={{ asset_v }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ asset_v }}">
  {% block head %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}">
</head>
<body>
  <header class="site-header">
    <nav class="nav-inner">
      <a class="site-logo" href="/">Cardboard Party</a>
      <div class="nav-links" id="nav-admin-link" style="display:none">
        <a href="/admin">Organisers</a>
        <a href="/admin/users">Users</a>
      </div>
      <div class="nav-user">
        {% if user %}
          <a id="nav-profile-link" href="#" style="display:none;align-items:center;gap:0.5rem;text-decoration:none;color:var(--text)">
            <img class="avatar" src="{{ user.picture }}" alt="{{ user.name }}">
            <span class="user-name">{{ user.name }}</span>
          </a>
          <a href="/auth/logout" class="btn btn-sm">Sign out</a>
        {% else %}
          <a href="/auth/login" class="btn btn-sm btn-primary">Sign in</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main class="page-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <a href="/about">About Cardboard Party</a>
    <span class="footer-sep">·</span>
    <a href="/discord-bot">Discord bot</a>
    <span class="footer-sep">·</span>
    <a href="/terms">Terms</a>
    <span class="footer-sep">·</span>
    <a href="/privacy">Privacy</a>
  </footer>

  <script src="/static/js/app.js?v={{ asset_v }}"></script>
  <script>
    fetch('/auth/me').then(r => r.json()).then(me => {
      if (!me.signed_in) return;

      // Set profile link now that we have the google ID
      const profileLink = document.getElementById('nav-profile-link');
      if (profileLink) {
        profileLink.href = `/players/${me.user.id}`;
        profileLink.style.display = 'flex';
      }

      // Show Organisers link if admin
      fetch('/api/admins').then(r => {
        if (r.ok) document.getElementById('nav-admin-link').style.display = '';
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
