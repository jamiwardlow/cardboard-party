{% extends "base.html" %}
{% block title %}Events — Cardboard Party{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Events</h1>
  {% if user %}
    <button class="btn btn-primary" onclick="openCreateModal()">+ New event</button>
  {% endif %}
</div>

<!-- Signed-in sections -->
<div id="my-sections" class="hidden">
  <div id="section-organized" class="hidden">
    <h2>My organized events</h2>
    <div id="list-organized" class="card-grid"></div>
  </div>
  <div id="section-registered" class="hidden">
    <h2>My registered events</h2>
    <div id="list-registered" class="card-grid"></div>
  </div>
  <h2>All events</h2>
</div>

<div id="event-list" class="card-grid">
  <p class="loading">Loading…</p>
</div>

<!-- Create event modal -->
<div id="create-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h2 id="create-title">New event</h2>

    <!-- Step 0: choose Simple or Advanced -->
    <div id="create-mode-choice">
      <div class="mode-cards">
        <button type="button" class="mode-card" onclick="chooseMode('simple')">
          <strong>Simple</strong>
          <span>Just the essentials.</span>
        </button>
        <button type="button" class="mode-card" onclick="chooseMode('advanced')">
          <strong>Advanced</strong>
          <span>Require decklists, set a registration window, and more.</span>
        </button>
      </div>
      <div class="modal-actions" style="margin-top:1.25rem">
        <button class="btn" onclick="closeCreateModal()">Cancel</button>
      </div>
    </div>

    <!-- Step 1: the form (shared, with advanced-only extras) -->
    <div id="create-form" class="hidden">
      <div id="create-errors" class="form-errors hidden"></div>
      <label class="adv-only">Game
        <select id="e-game" onchange="populateFormats()"></select>
        <span class="field-help">More games coming soon.</span>
      </label>
      <label>Name
        <input id="e-name" type="text" placeholder="Friday Night Draft">
      </label>
      <label>Type
        <select id="e-type">
          <option value="One-day">One-day</option>
          <option value="League">League</option>
        </select>
      </label>
      <label id="format-simple">Format
        <input id="e-format" type="text" value="Limited: Draft">
      </label>
      <label id="format-advanced" class="hidden">Format
        <select id="e-format-select" onchange="onFormatSelectChange()"></select>
        <input id="e-format-custom" type="text" placeholder="Enter custom format" class="hidden" style="margin-top:0.4rem">
      </label>
      <label class="adv-only">Structure
        <select id="e-structure" onchange="onStructureChange('e')">
          <option value="">— Select —</option>
          <option value="swiss">Swiss only</option>
          <option value="swiss_top_cut">Swiss + Top Cut</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label id="e-topcut-wrap" class="hidden">Top cut size
        <select id="e-topcut">
          <option value="8">Top 8</option>
          <option value="4">Top 4</option>
          <option value="16">Top 16</option>
        </select>
        <span class="field-help">Seeds the playoff bracket; you confirm the cut when Swiss ends.</span>
      </label>
      <div class="adv-only field-group">
        <span class="field-label">Tags</span>
        <div class="chip-options" id="e-tags">
          <label class="chip"><input type="checkbox" value="Weekly Play"> Weekly Play</label>
          <label class="chip"><input type="checkbox" value="Prerelease"> Prerelease</label>
          <label class="chip"><input type="checkbox" value="Regional Championship Qualifier"> Regional Championship Qualifier</label>
          <label class="chip"><input type="checkbox" value="Spotlight Series"> Spotlight Series</label>
        </div>
      </div>
      <label>Description
        <textarea id="e-description" rows="3" placeholder="Optional — details, house rules, where to meet, etc."></textarea>
      </label>
      <label class="adv-only">Schedule
        <textarea id="e-schedule" rows="3" placeholder="Optional — registration, check-in, rounds, breaks, top cut times"></textarea>
      </label>
      <label class="adv-only">Rules
        <textarea id="e-rules" rows="3" placeholder="Optional — format rules, banned cards, deck restrictions"></textarea>
      </label>
      <label class="adv-only">Prizes
        <textarea id="e-prizes" rows="3" placeholder="Optional — prize breakdown by placement"></textarea>
      </label>
      <label class="adv-only">Prize distribution deadline (days)
        <input id="e-prize-deadline" type="number" min="0" max="365" placeholder="e.g. 14">
      </label>
      <label class="adv-only">Contact
        <textarea id="e-contact" rows="2" placeholder="Optional — how to reach the organiser with questions"></textarea>
      </label>
      <label>Brand text
        <input id="e-brand-text" type="text" maxlength="300" placeholder="Optional — series, organiser, sponsor, or community">
        <span class="field-help">A brand image can be added after creating the event.</span>
      </label>
      <label>Entry cost
        <input id="e-cost" type="text" placeholder="e.g. $10 or Free">
      </label>
      <label>Payment link
        <input id="e-payment" type="text" placeholder="e.g. venmo.com/u/yourname (optional)">
      </label>
      <label>Date
        <input id="e-date" type="date">
      </label>
      <label>Number of rounds
        <input id="e-rounds" type="number" min="1" max="20" placeholder="Auto">
      </label>
      <label>Registration cap
        <input id="e-cap" type="number" min="2" max="256" placeholder="No cap">
      </label>
      <label class="adv-only">Registration type
        <select id="e-reg-type">
          <option value="open">Open</option>
          <option value="invite_only">Invite only</option>
        </select>
        <span class="field-help">Invite only disables self sign-up — you add players yourself.</span>
      </label>
      <label class="adv-only">Registration opens
        <input id="e-reg-start" type="date">
      </label>
      <label class="adv-only">Registration closes
        <input id="e-reg-end" type="date">
      </label>
      <label class="adv-only">Unenrollment deadline
        <input id="e-unenroll-end" type="date">
        <span class="field-help">After this date, players can't withdraw themselves.</span>
      </label>
      <label class="adv-only">Entry code
        <input id="e-entry-code" type="text" maxlength="64" placeholder="Optional — players must enter it to register">
      </label>
      <label>Round timer (minutes)
        <input id="e-round-timer" type="number" min="0" max="180" placeholder="No timer">
        <span class="field-help">Shows a countdown to players each round.</span>
      </label>
      <label class="adv-only checkbox-row">
        <input type="checkbox" id="e-delay-pairings">
        <span>Delay pairings
          <span class="field-help">New pairings stay hidden from players until you release them.</span>
        </span>
      </label>
      <label class="adv-only checkbox-row">
        <input type="checkbox" id="e-delay-standings">
        <span>Delay standings
          <span class="field-help">Standings stay hidden from players until you release them.</span>
        </span>
      </label>
      <label class="adv-only checkbox-row">
        <input type="checkbox" id="e-require-checkin">
        <span>Require check-in
          <span class="field-help">Only players you check in get paired.</span>
        </span>
      </label>
      <label class="adv-only checkbox-row">
        <input type="checkbox" id="e-draws-frowned">
        <span>Intentional draws are frowned upon
          <span class="field-help">When on, the "0-0-3 Intentional draw" result option is hidden.</span>
        </span>
      </label>
      <label class="adv-only checkbox-row">
        <input type="checkbox" id="e-decklists">
        <span>Require decklists
          <span class="field-help">Players are told a decklist is required for this event.</span>
        </span>
      </label>
      <label class="adv-only checkbox-row">
        <input type="checkbox" id="e-test-mode">
        <span>This event is in Test Mode
          <span class="field-help">Hidden from public event discovery — only you see it.</span>
        </span>
      </label>
      <div class="modal-actions">
        <button class="btn" onclick="backToModeChoice()">← Back</button>
        <button class="btn btn-primary" onclick="submitCreateEvent()">Create</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let me = null;

async function init() {
  const [eventsRes, meRes] = await Promise.all([
    fetch('/api/events'),
    fetch('/auth/me'),
  ]);
  const events = await eventsRes.json();
  me = await meRes.json();

  // Completed events sink to the back; within each group, newest first. This
  // keeps your active and not-yet-started events at the top of every list.
  events.sort((a, b) => {
    const af = isComplete(a) ? 1 : 0;
    const bf = isComplete(b) ? 1 : 0;
    if (af !== bf) return af - bf;
    return (b.date || '').localeCompare(a.date || '');
  });

  if (me.signed_in) {
    document.getElementById('my-sections').classList.remove('hidden');

    const organized  = events.filter(e => e.owner_id === me.user.id);
    // Any event you're a (non-dropped) player in counts as registered — including
    // ones you also organize, so adding yourself shows up here as expected.
    const registered = events.filter(e =>
      e.players?.some(p => p.google_id === me.user.id && !p.dropped)
    );

    if (organized.length) {
      document.getElementById('section-organized').classList.remove('hidden');
      document.getElementById('list-organized').innerHTML = organized.map(eventCard).join('');
    }
    if (registered.length) {
      document.getElementById('section-registered').classList.remove('hidden');
      document.getElementById('list-registered').innerHTML = registered.map(eventCard).join('');
    }
  }

  const allEl = document.getElementById('event-list');
  if (!events.length) {
    allEl.innerHTML = '<p class="empty">No events yet.</p>';
  } else {
    allEl.innerHTML = events.map(eventCard).join('');
  }
}

// Expected round count, mirroring the event page: explicit num_rounds, else
// the standard Swiss ceil(log2(players)) fallback.
function expectedRounds(e) {
  return e.num_rounds || Math.ceil(Math.log2(Math.max((e.players || []).length, 2)));
}

function isBracketRound(round) {
  return !!round && round.length > 0 && round[0].stage === 'bracket';
}

function bracketRoundName(matchCount) {
  if (matchCount === 1) return 'Finals';
  if (matchCount === 2) return 'Semifinals';
  if (matchCount === 4) return 'Quarterfinals';
  return `Top ${matchCount * 2}`;
}

// An event is complete once every expected Swiss round has been paired (the
// condition that shows "Event complete" on the event page), or — if cut to a
// playoff — once the bracket final has a winner. status === 'finished' is
// honoured too, but it's never set automatically.
function isComplete(e) {
  const rounds = e.rounds || [];
  const last = rounds[rounds.length - 1];
  if (isBracketRound(last)) return last.length === 1 && !!last[0].winner_id;
  const done = rounds.length;
  return e.status === 'finished' || (done > 0 && done >= expectedRounds(e));
}

function eventCard(e) {
  const activePlayers = (e.players || []).filter(p => !p.dropped).length;
  const cap     = e.registration_cap ? ` / ${e.registration_cap}` : '';
  const regTag  = e.registration === 'open'
    ? `<span class="reg-open">Registration open${cap}</span>`
    : `<span class="reg-closed">Registration closed</span>`;
  const rounds  = e.rounds || [];
  const last    = rounds[rounds.length - 1];
  const status  = isComplete(e) ? '<span class="reg-done">Completed</span>'
    : isBracketRound(last) ? `<span class="reg-active">${escapeHtml(bracketRoundName(last.length))}</span>`
    : e.status === 'setup' ? regTag
    : `<span class="reg-active">Round ${rounds.length} of ${expectedRounds(e)}</span>`;

  const testBadge = e.test_mode ? ' <span class="test-badge">TEST</span>' : '';
  const gameLine  = e.game ? `<div class="card-meta card-game">${escapeHtml(e.game)}</div>` : '';
  const tagChips  = (e.tags && e.tags.length)
    ? `<div class="card-tags">${e.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>`
    : '';
  return `<a class="card" href="/events/${encodeURIComponent(e.id)}">
    <div class="card-title">${escapeHtml(e.name)}${testBadge}</div>
    ${gameLine}
    <div class="card-meta">${escapeHtml(e.event_type || 'One-day')} · ${escapeHtml(e.date || '')}</div>
    <div class="card-meta">${escapeHtml(e.format || '')}</div>
    ${e.description ? `<div class="card-description">${escapeHtml(e.description)}</div>` : ''}
    ${e.entry_cost ? `<div class="card-meta">Entry: ${escapeHtml(e.entry_cost)}</div>` : ''}
    <div class="card-meta">${activePlayers} players${cap ? ' (cap: ' + e.registration_cap + ')' : ''}</div>
    ${tagChips}
    <div class="card-status">${status}</div>
  </a>`;
}

// Game → its formats. MTG only for now; the shape lets us add TCGs later by
// adding a key (and the backend just stores whatever game/format strings it gets).
const GAME_FORMATS = {
  'Magic: The Gathering': ['Standard', 'Pioneer', 'Modern', 'Legacy', 'Vintage',
    'Commander', 'Pauper', 'Limited', 'Draft', 'Sealed', 'Premodern', 'Canlander', 'Custom'],
};

let createMode = null;   // 'simple' | 'advanced'

function openCreateModal() {
  createMode = null;
  document.getElementById('e-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('create-title').textContent = 'New event';
  document.getElementById('create-mode-choice').classList.remove('hidden');
  document.getElementById('create-form').classList.add('hidden');
  // Populate the game list once (extensible from GAME_FORMATS).
  const gameSel = document.getElementById('e-game');
  if (!gameSel.options.length) {
    gameSel.innerHTML = Object.keys(GAME_FORMATS)
      .map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
  }
  document.getElementById('create-modal').classList.remove('hidden');
}
function closeCreateModal() {
  document.getElementById('create-modal').classList.add('hidden');
}

function clearCreateErrors() {
  document.getElementById('create-errors').classList.add('hidden');
  document.querySelectorAll('#create-form .invalid').forEach(el => el.classList.remove('invalid'));
}

function chooseMode(mode) {
  createMode = mode;
  clearCreateErrors();
  const adv = mode === 'advanced';
  document.querySelectorAll('#create-form .adv-only')
    .forEach(el => el.classList.toggle('hidden', !adv));
  document.getElementById('format-simple').classList.toggle('hidden', adv);
  document.getElementById('format-advanced').classList.toggle('hidden', !adv);
  if (adv) {
    populateFormats(); onStructureChange('e');
  } else {
    // Advanced-only dependent sub-fields aren't tagged .adv-only (their
    // visibility is driven by other inputs, not the mode), so the bulk toggle
    // above misses them — hide them explicitly so e.g. a Top cut size chosen in
    // Advanced doesn't linger on the Simple form. Values stay in the DOM, so
    // switching back to Advanced restores them (a draft across the switch).
    document.getElementById('e-topcut-wrap').classList.add('hidden');
  }
  document.getElementById('create-title').textContent =
    adv ? 'New event — Advanced' : 'New event — Simple';
  document.getElementById('create-mode-choice').classList.add('hidden');
  document.getElementById('create-form').classList.remove('hidden');
}

function backToModeChoice() {
  document.getElementById('create-form').classList.add('hidden');
  document.getElementById('create-mode-choice').classList.remove('hidden');
  document.getElementById('create-title').textContent = 'New event';
}

// Fill the Advanced format dropdown from the selected game.
function populateFormats() {
  const game = document.getElementById('e-game').value;
  const sel  = document.getElementById('e-format-select');
  sel.innerHTML = (GAME_FORMATS[game] || [])
    .map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('');
  onFormatSelectChange();
}

// "Custom" reveals a free-text field for the format name.
function onFormatSelectChange() {
  const isCustom = document.getElementById('e-format-select').value === 'Custom';
  document.getElementById('e-format-custom').classList.toggle('hidden', !isCustom);
}

// The Top Cut size only applies to a "Swiss + Top Cut" structure. Prefix is
// 'e' on the create modal and 'ee' on the edit modal (shared logic).
function onStructureChange(prefix) {
  const isTopCut = document.getElementById(`${prefix}-structure`).value === 'swiss_top_cut';
  document.getElementById(`${prefix}-topcut-wrap`).classList.toggle('hidden', !isTopCut);
}

function checkedTags(containerId) {
  return [...document.querySelectorAll(`#${containerId} input:checked`)].map(c => c.value);
}

// Client-side validation (Epic 11.2): block submit and show clear, per-field
// messages. The server also rejects a blank name as a backstop.
function validateCreate() {
  const adv = createMode === 'advanced';
  const errors = [];
  const mark = id => document.getElementById(id).classList.add('invalid');
  document.querySelectorAll('#create-form .invalid').forEach(el => el.classList.remove('invalid'));

  if (!document.getElementById('e-name').value.trim()) { errors.push('Event name is required.'); mark('e-name'); }
  if (!document.getElementById('e-date').value) { errors.push('Date is required.'); mark('e-date'); }

  if (adv) {
    if (!document.getElementById('e-game').value) { errors.push('Game is required.'); mark('e-game'); }
    const fsel = document.getElementById('e-format-select').value;
    if (fsel === 'Custom' && !document.getElementById('e-format-custom').value.trim()) {
      errors.push('Enter a name for the custom format.'); mark('e-format-custom');
    }
    const start = document.getElementById('e-reg-start').value;
    const end   = document.getElementById('e-reg-end').value;
    if (start && end && end < start) {
      errors.push('Registration close date is before the open date.'); mark('e-reg-start'); mark('e-reg-end');
    }
  } else if (!document.getElementById('e-format').value.trim()) {
    errors.push('Format is required.'); mark('e-format');
  }

  const box = document.getElementById('create-errors');
  if (errors.length) {
    box.innerHTML = 'Please fix the following:<ul>' + errors.map(e => `<li>${escapeHtml(e)}</li>`).join('') + '</ul>';
    box.classList.remove('hidden');
    const first = document.querySelector('#create-form .invalid');
    if (first) first.focus();
    return false;
  }
  box.classList.add('hidden');
  return true;
}

async function submitCreateEvent() {
  if (!validateCreate()) return;
  const adv       = createMode === 'advanced';
  const numRounds = parseInt(document.getElementById('e-rounds').value) || 0;
  const cap       = parseInt(document.getElementById('e-cap').value) || 0;

  let format, game = '', testMode = false, tags = [], structure = '', plannedCut = 0;
  if (adv) {
    game = document.getElementById('e-game').value;
    const sel = document.getElementById('e-format-select').value;
    format = sel === 'Custom'
      ? document.getElementById('e-format-custom').value.trim()
      : sel;
    testMode = document.getElementById('e-test-mode').checked;
    tags = checkedTags('e-tags');
    structure = document.getElementById('e-structure').value;
    if (structure === 'swiss_top_cut')
      plannedCut = parseInt(document.getElementById('e-topcut').value) || 0;
  } else {
    format = document.getElementById('e-format').value;
  }

  const body = {
    name:             document.getElementById('e-name').value,
    advanced:         adv,
    game,
    test_mode:        testMode,
    tags,
    structure,
    planned_cut_size: plannedCut,
    event_type:       document.getElementById('e-type').value,
    format,
    description:      document.getElementById('e-description').value,
    entry_cost:       document.getElementById('e-cost').value,
    payment_url:      document.getElementById('e-payment').value,
    date:             document.getElementById('e-date').value,
    num_rounds:       numRounds,
    registration_cap: cap,
    brand_text:       document.getElementById('e-brand-text').value,
    round_timer_minutes: parseInt(document.getElementById('e-round-timer').value) || 0,
  };
  if (adv) {
    body.requires_decklists  = document.getElementById('e-decklists').checked;
    body.prize_deadline_days = parseInt(document.getElementById('e-prize-deadline').value) || 0;
    body.rules    = document.getElementById('e-rules').value;
    body.schedule = document.getElementById('e-schedule').value;
    body.prizes   = document.getElementById('e-prizes').value;
    body.contact  = document.getElementById('e-contact').value;
    body.registration_type  = document.getElementById('e-reg-type').value;
    body.registration_start = document.getElementById('e-reg-start').value;
    body.registration_end   = document.getElementById('e-reg-end').value;
    body.unenroll_end        = document.getElementById('e-unenroll-end').value;
    body.entry_code                  = document.getElementById('e-entry-code').value;
    body.intentional_draws_frowned   = document.getElementById('e-draws-frowned').checked;
    body.delay_pairings              = document.getElementById('e-delay-pairings').checked;
    body.delay_standings             = document.getElementById('e-delay-standings').checked;
    body.require_check_in            = document.getElementById('e-require-checkin').checked;
  }
  const res = await fetch('/api/events', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (res.ok) {
    const e = await res.json();
    closeCreateModal();
    window.location = `/events/${e.id}`;
  } else {
    alert('Failed to create event.');
  }
}

init();
</script>
{% endblock %}
