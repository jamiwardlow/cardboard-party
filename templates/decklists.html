{% extends "base.html" %}
{% block title %}Decklists — {{ event.name }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="title-row"><h1>Decklists</h1></div>
    <p class="subtitle"><a href="/events/{{ event.id }}">← {{ event.name }}</a></p>
  </div>
</div>

<div class="action-row" style="margin-bottom:1rem">
  <button class="btn btn-sm" onclick="openMtgDecksModal()">Submit to MTGDecks</button>
  <a class="btn btn-sm" href="/events/{{ event.id }}/submit-tcdecks" target="_blank">Submit to TCDecks</a>
  <a class="btn btn-sm" href="/events/{{ event.id }}/submit-mtgtop8" target="_blank">Submit to MTG Top 8</a>
  <a class="btn btn-sm" href="/events/{{ event.id }}/submit-mtggoldfish" target="_blank">Submit to MTG Goldfish</a>
</div>

<!-- Submit to MTGDecks modal -->
<div id="mtgdecks-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>Submit to MTGDecks</h2>
    <div id="mtgdecks-body" style="margin:0.75rem 0"></div>
    <div class="modal-actions">
      <button class="btn" id="mtgdecks-cancel-btn" onclick="closeMtgDecksModal()">Cancel</button>
      <button class="btn btn-primary" id="mtgdecks-submit-btn" onclick="submitToMtgDecks()">Submit</button>
    </div>
  </div>
</div>

<div id="decklists-wrap"><p class="loading">Loading…</p></div>

<!-- View a player's decklist: editable deck name, proxy override, and the list -->
<div id="dv-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h2 id="dv-title">Decklist</h2>
    <label>Deck name
      <input id="dv-name" type="text" maxlength="120" placeholder="e.g. Mono-Red Burn">
    </label>
    <div class="dv-meta">
      <p id="dv-note" class="field-help"></p>
      <div id="dv-result" class="decklist-result"></div>
      <div id="dv-proxy"></div>
    </div>
    <div class="mox-row" style="margin-top:0.5rem">
      <input id="dv-mox-url" type="url" placeholder="…or paste a Moxfield deck URL to import">
      <button class="btn btn-sm" onclick="importMoxfieldDv(this)">Import</button>
    </div>
    <label style="display:flex;flex-direction:column;gap:0.35rem;font-size:0.88rem;font-weight:500">Decklist
      <textarea id="dv-text" class="decklist-view" style="min-height:16rem;resize:vertical;cursor:text;width:100%;box-sizing:border-box" placeholder="Paste decklist here…"></textarea>
    </label>
    <div id="dv-save-result" style="font-size:0.85rem;margin-top:0.3rem"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeDv()">Close</button>
      <button class="btn btn-primary" onclick="saveDvText()">Save decklist</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const EVENT_ID = "{{ event.id }}";
let rows = [], allowProxies = false, decklistsRequired = false, isComplete = false,
    sortKey = 'has_decklist', sortDir = 1, dvPlayerId = null;

async function load() {
  const res = await fetch(`/api/events/${EVENT_ID}/decklists`);
  if (!res.ok) {
    document.getElementById('decklists-wrap').innerHTML = '<p class="empty">Could not load decklists.</p>';
    return;
  }
  const d = await res.json();
  rows = d.players || []; allowProxies = !!d.allow_proxies; decklistsRequired = !!d.decklists_required;
  isComplete = !!d.is_complete;
  if (isComplete) { sortKey = 'rank'; sortDir = 1; }
  render();
}

function setSort(key) {
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
  render();
}

function render() {
  const wrap = document.getElementById('decklists-wrap');
  if (!rows.length) { wrap.innerHTML = '<p class="empty">No registered players yet.</p>'; return; }

  const submitted = rows.filter(r => r.has_decklist).length;
  const total     = rows.length;
  const missing   = total - submitted;
  let summary;
  if (decklistsRequired && missing > 0) {
    summary = `<p class="dl-summary dl-summary-warn">${submitted} of ${total} submitted — <strong>${missing} missing</strong></p>`;
  } else {
    summary = `<p class="dl-summary">${submitted} of ${total} submitted</p>`;
  }

  const sorted = rows.slice().sort((a, b) => {
    // Primary: sort key; secondary: always player name ascending.
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string' || typeof bv === 'string') {
      av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase();
    } else { av = av ?? Infinity; bv = bv ?? Infinity; }
    const primary = (av < bv ? -1 : av > bv ? 1 : 0) * sortDir;
    if (primary !== 0) return primary;
    return (a.player_name || '').toLowerCase() < (b.player_name || '').toLowerCase() ? -1 : 1;
  });

  const arrow = k => sortKey === k ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
  const head = `<tr>
      ${isComplete ? `<th onclick="setSort('rank')">#${arrow('rank')}</th>` : ''}
      <th onclick="setSort('player_name')">Player${arrow('player_name')}</th>
      <th onclick="setSort('has_decklist')">Submitted${arrow('has_decklist')}</th>
      <th onclick="setSort('maindeck')">Maindeck${arrow('maindeck')}</th>
      <th onclick="setSort('sideboard')">Sideboard${arrow('sideboard')}</th>
      ${allowProxies ? `<th onclick="setSort('proxy_count')">Proxy${arrow('proxy_count')}</th>` : ''}
    </tr>`;
  const body = sorted.map(r => {
    const player = r.google_id
      ? `<a href="/players/${encodeURIComponent(r.google_id)}">${escapeHtml(r.player_name)}</a>`
      : escapeHtml(r.player_name);
    const submitted_cell = r.has_decklist
      ? `<a href="#" onclick="viewDeck('${r.player_id}');return false">${r.deck_name ? escapeHtml(r.deck_name) : 'View decklist'}</a>`
      : `<a href="#" onclick="viewDeck('${r.player_id}');return false" class="${decklistsRequired ? 'dl-missing' : 'text-muted'}">${decklistsRequired ? 'Missing' : 'Add decklist'}</a>`;
    return `<tr${!r.has_decklist && decklistsRequired ? ' class="dl-row-missing"' : ''}>
        ${isComplete ? `<td class="rank-cell">${r.rank ?? '—'}</td>` : ''}
        <td>${player}</td>
        <td>${submitted_cell}</td>
        <td>${r.has_decklist ? r.maindeck : '—'}</td>
        <td>${r.has_decklist ? r.sideboard : '—'}</td>
        ${allowProxies ? `<td>${!r.has_decklist ? '—' : (r.proxy_count + (r.proxy_override ? ` <span class="proxy-ovr" title="${escapeHtml(r.proxy_override_note)}">override</span>` : ''))}</td>` : ''}
      </tr>`;
  }).join('');
  wrap.innerHTML = summary + `<div class="table-scroll"><table class="decklist-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

async function viewDeck(pid) {
  document.getElementById('dv-modal').classList.remove('hidden');
  document.getElementById('dv-title').textContent = 'Loading…';
  document.getElementById('dv-text').value = '';
  document.getElementById('dv-save-result').textContent = '';
  const res = await fetch(`/api/events/${EVENT_ID}/players/${encodeURIComponent(pid)}/decklist`);
  if (!res.ok) { document.getElementById('dv-title').textContent = 'Could not load decklist.'; return; }
  const d = await res.json();
  dvPlayerId = pid;
  document.getElementById('dv-title').textContent = `${d.name}'s decklist`;
  document.getElementById('dv-name').value = d.deck_name || '';
  const v = d.validation || {};
  const note = [];
  if (v.maindeck_count != null) note.push(`${v.maindeck_count} maindeck · ${v.sideboard_count} sideboard`);
  if (allowProxies && v.proxy_count) note.push(`${v.proxy_count} proxies`);
  document.getElementById('dv-note').textContent = note.join(' · ');
  const issues = (v.issues || []);
  document.getElementById('dv-result').innerHTML = issues.length
    ? '<ul class="dl-issues">' + issues.map(i =>
        `<li class="dl-${i.severity}">${escapeHtml(i.message)}</li>`).join('') + '</ul>'
    : '';
  document.getElementById('dv-text').value = d.text || '';
  document.getElementById('dv-save-result').textContent = '';
  const dvp = document.getElementById('dv-proxy');
  if (allowProxies) {
    dvp.style.display = '';
    dvp.innerHTML = d.proxy_override
      ? `<p class="dl-note">⚠️ Proxy validation overridden — ${escapeHtml(d.proxy_override_note)} `
        + `<button class="btn btn-sm" onclick="clearProxyOverride('${pid}')">Clear</button></p>`
      : `<button class="btn btn-sm" onclick="setProxyOverride('${pid}')">Override proxy check</button>`;
  } else { dvp.style.display = 'none'; }
  document.getElementById('dv-modal').classList.remove('hidden');
}
async function saveDvText() {
  const text = document.getElementById('dv-text').value;
  const name = document.getElementById('dv-name').value;
  const resultEl = document.getElementById('dv-save-result');
  resultEl.textContent = 'Saving…';
  const res = await fetch(`/api/events/${EVENT_ID}/players/${encodeURIComponent(dvPlayerId)}/decklist`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ text, name }),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) { resultEl.style.color = 'var(--danger)'; resultEl.textContent = d.error || 'Could not save.'; return; }
  const r = rows.find(x => x.player_id === dvPlayerId);
  if (r) {
    r.has_decklist = d.has_decklist;
    r.deck_name = name.trim();
    const v = d.validation || {};
    r.maindeck = v.maindeck_count ?? 0;
    r.sideboard = v.sideboard_count ?? 0;
    r.proxy_count = v.proxy_count ?? 0;
  }
  render();
  closeDv();
}

function closeDv() { document.getElementById('dv-modal').classList.add('hidden'); }

async function importMoxfieldDv(btn) {
  const url = document.getElementById('dv-mox-url').value.trim();
  if (!url) return;
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Importing…';
  const resultEl = document.getElementById('dv-save-result');
  try {
    const res = await fetch(`/api/events/${EVENT_ID}/players/${encodeURIComponent(dvPlayerId)}/decklist/import-moxfield`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ url }),
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      resultEl.style.color = 'var(--danger)'; resultEl.textContent = d.error || 'Could not import from Moxfield.'; return;
    }
    document.getElementById('dv-text').value = d.text || '';
    if (d.name) document.getElementById('dv-name').value = d.name;
    resultEl.style.color = 'var(--muted)'; resultEl.textContent = 'Imported — review and save.';
  } finally { btn.disabled = false; btn.textContent = orig; }
}

async function setProxyOverride(pid) {
  const note = prompt('Note for overriding proxy validation (required):', '');
  if (note === null) return;
  if (!note.trim()) { alert('A note is required to override.'); return; }
  await sendProxyOverride(pid, true, note);
}
async function clearProxyOverride(pid) { await sendProxyOverride(pid, false, ''); }

async function sendProxyOverride(pid, override, note) {
  const res = await fetch(`/api/events/${EVENT_ID}/players/${encodeURIComponent(pid)}/proxy-override`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ override, note }),
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); alert(e.error || 'Could not update the override.'); return; }
  const r = rows.find(x => x.player_id === pid);
  if (r) { r.proxy_override = override; r.proxy_override_note = override ? note.trim() : ''; }
  render(); viewDeck(pid);   // refresh the open modal
}


load();

function openMtgDecksModal() {
  const withDeck = rows.filter(r => r.has_decklist).length;
  const missing  = rows.length - withDeck;
  const body = document.getElementById('mtgdecks-body');
  const submitBtn = document.getElementById('mtgdecks-submit-btn');
  const cancelBtn = document.getElementById('mtgdecks-cancel-btn');
  submitBtn.disabled = withDeck === 0;
  submitBtn.textContent = 'Submit';
  cancelBtn.textContent = 'Cancel';
  if (withDeck === 0) {
    body.innerHTML = '<p>No players have submitted decklists yet.</p>';
  } else {
    let html = `<p>${withDeck} of ${rows.length} player${rows.length === 1 ? '' : 's'} will be submitted.`;
    if (missing > 0) html += ` <strong>${missing} without a decklist will be skipped.</strong>`;
    html += '</p>';
    body.innerHTML = html;
  }
  document.getElementById('mtgdecks-modal').classList.remove('hidden');
}

function closeMtgDecksModal() {
  document.getElementById('mtgdecks-modal').classList.add('hidden');
}

async function submitToMtgDecks() {
  const body      = document.getElementById('mtgdecks-body');
  const submitBtn = document.getElementById('mtgdecks-submit-btn');
  const cancelBtn = document.getElementById('mtgdecks-cancel-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';
  try {
    const res  = await fetch(`/api/events/${EVENT_ID}/submit-mtgdecks`, { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      let html = `<p style="color:var(--danger)">${escapeHtml(data.error || 'Submission failed.')}</p>`;
      if (data.errors && data.errors.length) {
        html += '<ul style="color:var(--danger);margin:0.4rem 0 0 1.2rem;font-size:0.9rem">'
          + data.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('') + '</ul>';
      }
      body.innerHTML = html;
      submitBtn.textContent = 'Retry';
      submitBtn.disabled = false;
      return;
    }
    let html = `<p>${data.submitted} decklist${data.submitted === 1 ? '' : 's'} submitted successfully.</p>`;
    if (data.url) {
      html += `<p><a href="${escapeHtml(data.url)}" target="_blank" rel="noopener">View on MTGDecks →</a></p>`;
    }
    body.innerHTML = html;
    submitBtn.style.display = 'none';
    cancelBtn.textContent = 'Close';
  } catch (_) {
    body.innerHTML = `<p style="color:var(--danger)">Network error — please try again.</p>`;
    submitBtn.textContent = 'Retry';
    submitBtn.disabled = false;
  }
}
</script>
{% endblock %}
